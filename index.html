<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Editor Undangan Pernikahan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&family=Montserrat:wght@400;500;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --bg: #1b1b1f;
        --panel: #26262c;
        --panel2: #303038;
        --panel3: #3a3a44;
        --line: #454551;
        --txt: #f3f1ea;
        --mut: #a8a49a;
        --acc: #c9a24b;
        --acc-ink: #241c08;
        --sel: #4f9dd8;
        --danger: #e0685f;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Jost", system-ui, sans-serif;
        background: var(--bg);
        color: var(--txt);
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      svg.ic { width: 20px; height: 20px; flex: none; display: block; }

      /* ---------- App frame ---------- */
      #app { display: flex; flex-direction: column; height: 100dvh; }
      header.topbar {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        z-index: 30;
      }
      .tpl-name { font-size: 15px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
      .tpl-name small { display: block; font-size: 11px; font-weight: 400; color: var(--mut); letter-spacing: .04em; }
      .spacer { flex: 1; }
      .tbtn {
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        min-width: 40px; padding: 0 10px;
        background: transparent; color: var(--txt);
        border: 1px solid transparent; border-radius: 8px; font-size: 14px;
      }
      .tbtn:hover { background: var(--panel2); }
      .tbtn:disabled { opacity: .35; cursor: default; background: transparent; }
      .tbtn.primary { background: var(--acc); color: var(--acc-ink); font-weight: 600; }
      .tbtn.primary:hover { background: #d8b25c; }
      .tbtn .lbl { display: none; }
      @media (min-width: 720px) { .tbtn .lbl { display: inline; } }

      #dlwrap { position: relative; }
      #dlmenu {
        position: absolute; right: 0; top: calc(100% + 8px); width: 250px;
        background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
        padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.5); display: none; z-index: 60;
      }
      #dlmenu.open { display: block; }
      #dlmenu button {
        display: flex; width: 100%; align-items: center; gap: 10px; text-align: left;
        background: transparent; border: 0; color: var(--txt); border-radius: 8px;
        padding: 9px 10px; font-size: 14px; min-height: 44px;
      }
      #dlmenu button:hover { background: var(--panel3); }
      #dlmenu button small { display: block; color: var(--mut); font-size: 12px; }
      #dlmenu button:disabled { opacity: .5; }

      main.workspace { flex: 1; display: flex; min-height: 0; }

      /* ---------- Stage ---------- */
      #stage {
        position: relative; flex: 1; min-width: 0;
        overflow: auto; display: flex;
        background:
          radial-gradient(1200px 700px at 50% 30%, #26262c 0%, #17171b 70%);
      }
      #sizer { margin: auto; position: relative; flex: none; }
      #board {
        position: absolute; left: 0; top: 0;
        width: 1000px; height: 1414px;
        transform-origin: 0 0;
        box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.5);
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #board .decor { position: absolute; inset: 0; pointer-events: none; }
      #board .decor svg { width: 100%; height: 100%; display: block; }
      .el { position: absolute; cursor: grab; }
      .el:active { cursor: grabbing; }
      .el-text {
        white-space: pre-wrap; word-break: break-word;
        line-height: 1.25; padding: 0; margin: 0;
      }
      .el-img { overflow: hidden; }
      .el-img img { position: absolute; max-width: none; pointer-events: none; }
      .el-div { display: flex; align-items: center; }
      .el-div svg { width: 100%; display: block; }
      #selbox {
        position: absolute; pointer-events: none; display: none; z-index: 50;
        outline: calc(2px * var(--inv, 1)) solid var(--sel);
        outline-offset: calc(3px * var(--inv, 1));
      }
      #selbox .handle {
        position: absolute; right: 0; bottom: 0;
        width: calc(30px * var(--inv, 1)); height: calc(30px * var(--inv, 1));
        transform: translate(50%, 50%);
        background: var(--sel); border-radius: 50%;
        border: calc(3px * var(--inv, 1)) solid #fff;
        pointer-events: auto; cursor: nwse-resize; touch-action: none;
      }

      #selbar {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        display: none; gap: 4px; z-index: 40;
        background: rgba(28,28,34,.94); border: 1px solid var(--line);
        border-radius: 999px; padding: 4px;
        box-shadow: 0 8px 24px rgba(0,0,0,.45);
      }
      #selbar.show { display: flex; }
      #selbar button {
        display: inline-flex; align-items: center; gap: 6px;
        background: transparent; border: 0; color: var(--txt);
        border-radius: 999px; padding: 0 12px; font-size: 13px; min-height: 36px;
      }
      #selbar button:hover { background: var(--panel3); }
      #selbar button.danger { color: #ff9d94; }
      #selbar svg.ic { width: 17px; height: 17px; }

      #zoomctl {
        position: absolute; right: 10px; bottom: 10px; z-index: 40;
        display: flex; align-items: center; gap: 2px;
        background: rgba(28,28,34,.94); border: 1px solid var(--line);
        border-radius: 999px; padding: 3px;
      }
      #zoomctl button {
        width: 38px; height: 38px; border-radius: 50%; border: 0;
        background: transparent; color: var(--txt); font-size: 18px;
        display: inline-flex; align-items: center; justify-content: center;
      }
      #zoomctl button:hover { background: var(--panel3); }
      #zoomctl .pct { min-width: 46px; text-align: center; font-size: 13px; color: var(--mut); }

      /* ---------- Panel ---------- */
      aside.panel {
        width: 324px; flex: none; display: flex; flex-direction: column;
        background: var(--panel); border-left: 1px solid var(--line); z-index: 20;
      }
      .tabs { display: flex; gap: 2px; padding: 8px 8px 0; }
      .tabs button {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
        background: transparent; border: 0; border-bottom: 2px solid transparent;
        color: var(--mut); font-size: 12px; padding: 7px 2px 8px; min-height: 52px;
        border-radius: 8px 8px 0 0;
      }
      .tabs button svg.ic { width: 21px; height: 21px; }
      .tabs button.on { color: var(--txt); border-bottom-color: var(--acc); background: var(--panel2); }
      .tabbody { flex: 1; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
      .tabbody h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
      .tabbody h3:not(:first-child) { margin-top: 20px; }
      .hint { color: var(--mut); font-size: 14px; line-height: 1.55; }

      .tplcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .tplcard {
        border: 2px solid var(--line); border-radius: 10px; overflow: hidden;
        background: var(--panel2); padding: 0; color: var(--txt); text-align: center;
      }
      .tplcard.on { border-color: var(--acc); }
      .tplcard .thumb { display: block; height: 74px; position: relative; }
      .tplcard .thumb::after {
        content: ""; position: absolute; inset: 8px;
        border: 1.5px solid currentColor; border-radius: 3px; opacity: .55;
      }
      .tplcard .nm { display: block; font-size: 12px; padding: 6px 2px 8px; line-height: 1.25; }

      .swrow { display: flex; flex-wrap: wrap; gap: 8px; }
      .sw {
        width: 38px; height: 38px; border-radius: 50%; flex: none;
        border: 2px solid rgba(255,255,255,.18); padding: 0; position: relative;
      }
      .sw.on { border-color: var(--sel); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--sel); }
      .sw.custom {
        display: inline-flex; align-items: center; justify-content: center;
        background: conic-gradient(#e0685f, #e8b34b, #7d9478, #4f9dd8, #9a7bc0, #e0685f);
        color: #fff; font-size: 18px; font-weight: 600; overflow: hidden;
      }
      .sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; min-height: 0; }

      .addbtn {
        display: flex; align-items: center; gap: 12px; width: 100%;
        background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
        border-radius: var(--radius); padding: 12px 14px; font-size: 15px; margin-bottom: 10px;
        text-align: left; min-height: 52px;
      }
      .addbtn:hover { background: var(--panel3); }
      .addbtn small { display: block; color: var(--mut); font-size: 12.5px; }
      .addbtn svg.ic { width: 24px; height: 24px; color: var(--acc); }

      textarea.edit-text {
        width: 100%; min-height: 74px; resize: vertical;
        background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius);
        color: var(--txt); font-family: inherit; font-size: 15px; padding: 10px 12px; line-height: 1.45;
      }
      textarea.edit-text:focus { outline: 2px solid var(--sel); outline-offset: 0; border-color: transparent; }

      .fontgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .fontchip {
        background: var(--panel2); border: 1.5px solid var(--line); color: var(--txt);
        border-radius: var(--radius); padding: 8px 6px; min-height: 52px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      }
      .fontchip.on { border-color: var(--acc); }
      .fontchip .sample { font-size: 19px; line-height: 1.15; white-space: nowrap; }
      .fontchip .fname { font-size: 10.5px; color: var(--mut); font-family: "Jost", sans-serif; }

      .fontcurrent {
        display: flex; align-items: center; gap: 12px; width: 100%;
        background: var(--panel2); border: 1.5px solid var(--line); color: var(--txt);
        border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; text-align: left;
        min-height: 58px;
      }
      .fontcurrent:hover { background: var(--panel3); }
      .fontcurrent .fc-sample { font-size: 23px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
      .fontcurrent .fc-meta { flex: 1; min-width: 0; }
      .fontcurrent .fc-meta b { display: block; font-size: 14.5px; font-family: "Jost", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fontcurrent .fc-meta small { color: var(--mut); font-size: 12px; font-family: "Jost", sans-serif; }
      .fontcurrent .fc-chev { font-size: 26px; color: var(--mut); flex: none; }

      /* ---------- Pemilih font ---------- */
      #fontpicker {
        position: fixed; inset: 0; z-index: 180; display: none;
        background: var(--bg);
      }
      #fontpicker.open { display: block; }
      .fp-inner { display: flex; flex-direction: column; height: 100%; max-width: 680px; margin: 0 auto; }
      @media (min-width: 720px) {
        #fontpicker { background: rgba(8, 8, 10, .62); padding: 4dvh 18px; }
        .fp-inner { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
      }
      .fp-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
      .fp-head .back {
        width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
        background: var(--panel2); color: var(--txt); font-size: 19px; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .fp-title { font-size: 18px; font-weight: 600; }
      .fp-title small { display: block; font-size: 12.5px; font-weight: 400; color: var(--mut); }
      .fp-search { padding: 6px 14px 10px; }
      .fp-search input {
        width: 100%; background: var(--panel2); border: 1px solid var(--line);
        border-radius: 999px; color: var(--txt); font-family: inherit; font-size: 16px;
        padding: 11px 18px; min-height: 46px;
      }
      .fp-search input:focus { outline: 2px solid var(--sel); border-color: transparent; }
      .fp-cats { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 14px 12px; }
      .fp-cats button {
        border: 1.5px solid var(--line); background: var(--panel2); color: var(--txt);
        border-radius: 999px; padding: 0 15px; font-size: 13.5px; min-height: 38px;
      }
      .fp-cats button.on { border-color: var(--acc); background: var(--panel3); }
      .fp-list { flex: 1; overflow-y: auto; padding: 0 8px 10px; -webkit-overflow-scrolling: touch; }
      .fp-row {
        display: flex; align-items: center; gap: 12px; width: 100%;
        background: transparent; border: 0; border-bottom: 1px solid var(--line);
        color: var(--txt); padding: 11px 10px; min-height: 62px; text-align: left; border-radius: 6px;
      }
      .fp-row.on { background: var(--panel2); box-shadow: inset 0 0 0 1.5px var(--acc); }
      .fp-row .fp-sample { flex: 1; font-size: 25px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fp-row .fp-meta { flex: none; text-align: right; max-width: 40%; }
      .fp-row .fp-meta b { display: block; font-size: 13px; font-family: "Jost", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fp-row .fp-meta small { font-size: 11.5px; color: var(--mut); font-family: "Jost", sans-serif; }
      .fp-row .fp-check { color: var(--acc); font-size: 19px; flex: none; }
      .fp-more {
        display: block; width: calc(100% - 12px); margin: 12px auto 4px;
        background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
        border-radius: 999px; min-height: 46px; font-size: 14.5px;
      }
      .fp-foot {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line); background: var(--panel);
      }
      .fp-foot span { flex: 1; font-size: 14px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fp-foot span b { color: var(--txt); }
      .fp-foot button {
        background: var(--acc); color: var(--acc-ink); border: 0; font-weight: 600;
        border-radius: 999px; padding: 0 24px; min-height: 46px; font-size: 15px;
      }

      .ctl { margin-bottom: 14px; }
      .ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--mut); margin-bottom: 6px; }
      .ctl label output { color: var(--txt); font-weight: 500; }
      input[type="range"] { width: 100%; accent-color: var(--acc); min-height: 32px; padding: 0; }

      .segrow { display: flex; gap: 6px; flex-wrap: wrap; }
      .seg {
        flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        background: var(--panel2); border: 1.5px solid var(--line); color: var(--txt);
        border-radius: 9px; padding: 0 8px; font-size: 14px; min-height: 42px; min-width: 44px;
      }
      .seg.on { border-color: var(--acc); background: var(--panel3); }
      .seg svg.ic { width: 18px; height: 18px; }

      .actrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .actbtn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
        border-radius: 9px; padding: 0 10px; font-size: 14px; min-height: 44px;
      }
      .actbtn:hover { background: var(--panel3); }
      .actbtn.danger { color: #ff9d94; }
      .actbtn svg.ic { width: 18px; height: 18px; }

      .nudgepad { display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; justify-content: center; }
      .nudgepad button {
        height: 44px; border-radius: 9px; border: 1px solid var(--line);
        background: var(--panel2); color: var(--txt); font-size: 17px;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .nudgepad button:hover { background: var(--panel3); }
      .nudgepad .blank { visibility: hidden; }

      .layeritem {
        display: flex; align-items: center; gap: 8px; width: 100%;
        background: var(--panel2); border: 1.5px solid var(--line); color: var(--txt);
        border-radius: 9px; padding: 8px 8px 8px 12px; margin-bottom: 7px; text-align: left;
        min-height: 48px; font-size: 14px;
      }
      .layeritem.on { border-color: var(--sel); }
      .layeritem .tag { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); flex: none; }
      .layeritem .snip { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
      .layeritem .mv { display: flex; flex-direction: column; gap: 2px; flex: none; }
      .layeritem .mv button {
        min-height: 0; height: 21px; width: 34px; padding: 0; border-radius: 5px;
        background: var(--panel3); border: 0; color: var(--txt); font-size: 11px; line-height: 1;
      }

      /* ---------- Inline text editor overlay ---------- */
      #textedit {
        position: fixed; z-index: 100; display: none;
        border: 2px solid var(--sel); border-radius: 4px;
        background: rgba(255,255,255,.96); padding: 2px 4px;
        resize: none; overflow: hidden;
      }
      #textedit:focus { outline: none; }

      /* ---------- Preview ---------- */
      #exitPreview {
        position: fixed; top: 12px; right: 12px; z-index: 200; display: none;
        background: var(--acc); color: var(--acc-ink); border: 0; font-weight: 600;
        border-radius: 999px; padding: 0 18px; min-height: 44px; font-size: 15px;
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
      }
      body.preview header.topbar, body.preview aside.panel,
      body.preview #selbar, body.preview #zoomctl { display: none; }
      body.preview #exitPreview { display: block; }
      body.preview #board { box-shadow: 0 24px 80px rgba(0,0,0,.6); }

      /* ---------- Toast ---------- */
      #toast {
        position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
        background: #101014; color: var(--txt); border: 1px solid var(--line);
        border-radius: 999px; padding: 11px 18px; font-size: 14px; z-index: 300;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
        box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: min(92vw, 480px); text-align: center;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- Mobile layout ---------- */
      @media (max-width: 859px) {
        main.workspace { flex-direction: column; }
        #stage { padding-bottom: 60px; }
        aside.panel {
          width: auto; border-left: 0; border-top: 1px solid var(--line);
          height: 43dvh; flex: none;
        }
        .tabs { order: 2; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
        .tabs button { border-bottom: 0; border-top: 2px solid transparent; border-radius: 0 0 8px 8px; }
        .tabs button.on { border-top-color: var(--acc); }
        .tabbody { order: 1; padding: 12px 14px; }
        .tpl-name small { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="tpl-name"><span id="tplName">Klasik Emas</span><small>Undangan Pernikahan · 10 × 14,8 cm</small></div>
        <div class="spacer"></div>
        <button class="tbtn" id="undoBtn" title="Urungkan (Undo)" aria-label="Urungkan">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="tbtn" id="redoBtn" title="Ulangi (Redo)" aria-label="Ulangi">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <button class="tbtn" id="previewBtn" title="Pratinjau">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="lbl">Pratinjau</span>
        </button>
        <div id="dlwrap">
          <button class="tbtn primary" id="dlBtn">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/></svg>
            <span class="lbl">Unduh</span>
          </button>
          <div id="dlmenu" role="menu">
            <button id="dlPdf">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
              <span>PDF siap cetak<small>A5 · 300 DPI · untuk dibawa ke percetakan</small></span>

      /* ---------- State ---------- */

      function restore(json) {
        const s = JSON.parse(json);

      /* ---------- Layout / zoom ---------- */
      function layout() {
        const r = stage.getBoundingClientRect();

        const fit = Math.min((r.width - 30) / W, (r.height - 30 - reserveB) / H);
        scale = Math.max(0.05, fit * state.zoom);
        sizer.style.width = W * scale + "px";
        sizer.style.height = H * scale + "px";
        board.style.transform = "scale(" + scale + ")";
        board.style.setProperty("--inv", String(1 / scale));
        $("zoomPct").textContent = Math.round(state.zoom * 100) + "%";

      /* ---------- Render kanvas ---------- */
      function shapeRadius(el) {
        if (el.shape === "circle" || el.shape === "oval") return "50%";
        if (el.shape === "arch") return "999px 999px 14px 14px";
        if (el.shape === "straight") return "6px";
        return "26px";
      }
      function imgGeom(el) {
        const w = el.w, h = el.h, nw = el.nw || 1000, nh = el.nh || 1000;
        const base = Math.max(w / nw, h / nh);
        const dw = nw * base * el.zoom, dh = nh * base * el.zoom;
        const dx = el.x + (w - dw) / 2 + (el.px / 100) * (dw - w) / 2;
        const dy = el.y + (h - dh) / 2 + (el.py / 100) * (dh - h) / 2;
        return { dw, dh, dx, dy };
      }
      function applyElStyle(node, el) {
        node.style.left = el.x + "px";
        node.style.top = el.y + "px";
        if (el.type === "text") {
          node.style.width = el.w + "px";
          node.style.fontFamily = fam(el.font) + ", serif";
          node.style.fontSize = el.size + "px";
          node.style.color = el.color;
          node.style.textAlign = el.align;
          node.style.fontWeight = el.bold ? "700" : "400";
          node.style.fontStyle = el.italic ? "italic" : "normal";
          node.style.letterSpacing = el.ls + "px";
          node.style.lineHeight = el.lh;
        } else if (el.type === "image") {
          node.style.width = el.w + "px";
          node.style.height = el.h + "px";
          node.style.borderRadius = shapeRadius(el);
          const g = imgGeom(el), im = node.firstChild;
          im.style.width = g.dw + "px"; im.style.height = g.dh + "px";
          im.style.left = (g.dx - el.x) + "px"; im.style.top = (g.dy - el.y) + "px";
        } else if (el.type === "divider") {
          node.style.width = el.w + "px";
          node.style.height = el.h + "px";
          node.innerHTML = dividerSVG(el.color);

      let drag = null;

        [["arch", "Lengkung"], ["circle", "Lingkaran"], ["oval", "Oval"], ["rounded", "Tumpul"], ["straight", "Kotak"]].forEach(([s, label]) => {
          const bb = document.createElement("button");
          bb.className = "seg" + (el.shape === s ? " on" : ""); bb.textContent = label; bb.style.flex = "1 1 30%";
          bb.addEventListener("click", () => { el.shape = s; refreshEl(el); commit(); renderPanel(); });
          seg.appendChild(bb);
        });
        tabbody.appendChild(seg);

        const h3 = document.createElement("h3"); h3.textContent = "Posisi foto di bingkai"; tabbody.appendChild(h3);
        tabbody.appendChild(rangeCtl("Perbesar (zoom)", 1, 3, 0.01, el.zoom, (v) => Math.round(v * 100) + "%",
          (v) => { el.zoom = v; refreshEl(el); }));
        tabbody.appendChild(rangeCtl("Geser kiri — kanan", -100, 100, 1, el.px, (v) => v,
          (v) => { el.px = v; refreshEl(el); }));
        tabbody.appendChild(rangeCtl("Geser atas — bawah", -100, 100, 1, el.py, (v) => v,
          (v) => { el.py = v; refreshEl(el); }));
      }

      function renderDividerControls(el) {
        const h = document.createElement("h3"); h.textContent = "Warna ornamen"; tabbody.appendChild(h);
        tabbody.appendChild(swatchRow(INK_SWATCHES, el.color,
          (c, commitIt) => { el.color = c; refreshEl(el); if (commitIt !== false) { commit(); renderPanel(); } }, true));
        const h2 = document.createElement("h3"); h2.textContent = "Lebar"; tabbody.appendChild(h2);
        tabbody.appendChild(rangeCtl("Lebar garis", 120, 800, 5, el.w, (v) => v + " px",
          (v) => { el.w = v; el.x = Math.round(el.x); refreshEl(el); }));
      }

      function renderCommonControls(el) {
        const h = document.createElement("h3"); h.textContent = "Posisi halus"; tabbody.appendChild(h);
        const pad = document.createElement("div"); pad.className = "nudgepad";
        const steps = [["", ""], ["↑", () => { el.y -= 4; }], ["", ""], ["←", () => { el.x -= 4; }], ["Tengah", () => { el.x = Math.round((W - el.w) / 2); }], ["→", () => { el.x += 4; }], ["", ""], ["↓", () => { el.y += 4; }], ["", ""]];
        steps.forEach(([label, fn]) => {
          const b = document.createElement("button");
          if (!label) { b.className = "blank"; b.tabIndex = -1; }
          else {
            b.textContent = label;
            if (label === "Tengah") b.style.fontSize = "12px";
            b.addEventListener("click", () => { fn(); refreshEl(el); commit(); });
          }
          pad.appendChild(b);
        });
        tabbody.appendChild(pad);

        const h2 = document.createElement("h3"); h2.textContent = "Elemen"; tabbody.appendChild(h2);
        const row = document.createElement("div"); row.className = "actrow";
        const mk = (label, cls, fn) => {
          const b = document.createElement("button");
          b.className = "actbtn" + (cls ? " " + cls : ""); b.textContent = label;
          b.addEventListener("click", fn); row.appendChild(b);
        };
        mk("Duplikat", "", () => duplicateEl(el));
        mk("Ke depan", "", () => moveLayer(el, 1));
        mk("Ke belakang", "", () => moveLayer(el, -1));
        mk("Hapus", "danger", () => deleteEl(el));
        tabbody.appendChild(row);
      }

      function renderLayersTab() {
        const h = document.createElement("h3"); h.textContent = "Lapisan (atas = paling depan)"; tabbody.appendChild(h);
        if (!state.elements.length) {
          const p = document.createElement("p"); p.className = "hint"; p.textContent = "Belum ada elemen.";
          tabbody.appendChild(p); return;
        }
        [...state.elements].reverse().forEach((el) => {
          const item = document.createElement("div");
          item.className = "layeritem" + (el.id === state.selectedId ? " on" : "");
          const tag = el.type === "text" ? "Teks" : el.type === "image" ? "Foto" : "Hiasan";
          const snip = el.type === "text" ? el.text.replace(/\n/g, " ").slice(0, 42) : el.type === "image" ? "Foto mempelai" : "Garis ornamen";
          item.innerHTML = `<span class="tag">${tag}</span><span class="snip"></span>
            <span class="mv"><button data-mv="1" aria-label="Naikkan lapisan">▲</button><button data-mv="-1" aria-label="Turunkan lapisan">▼</button></span>`;
          item.querySelector(".snip").textContent = snip;
          item.addEventListener("click", (e) => {
            const mv = e.target.closest("[data-mv]");
            if (mv) { moveLayer(el, parseInt(mv.dataset.mv, 10)); return; }
            select(el.id);
          });
          tabbody.appendChild(item);
        });
      }

      /* ---------- Aksi elemen ---------- */
      function duplicateEl(el) {
        const c = JSON.parse(JSON.stringify(el));
        c.id = uid(); c.x += 24; c.y += 24;
        state.elements.splice(state.elements.indexOf(el) + 1, 0, c);
        commit(); renderBoard(); select(c.id);
        toast("Elemen diduplikat.");
      }
      function deleteEl(el) {
        state.elements = state.elements.filter((x) => x.id !== el.id);
        state.selectedId = null;
        commit(); renderAll();
        toast("Elemen dihapus. Tombol urungkan bisa mengembalikannya.");
      }
      function moveLayer(el, dir) {
        const i = state.elements.indexOf(el);
        const j = i + dir;
        if (j < 0 || j >= state.elements.length) return;
        state.elements.splice(i, 1);
        state.elements.splice(j, 0, el);
        commit(); renderBoard(); renderPanel(); positionSelbox();
      }
      $("sbDup").addEventListener("click", () => { const el = sel(); if (el) duplicateEl(el); });
      $("sbDel").addEventListener("click", () => { const el = sel(); if (el) deleteEl(el); });
      $("sbFront").addEventListener("click", () => { const el = sel(); if (el) moveLayer(el, 1); });
      $("sbBack").addEventListener("click", () => { const el = sel(); if (el) moveLayer(el, -1); });

      /* ---------- Ambil foto dari perangkat ---------- */
      let photoCb = null;
      function pickPhoto(cb) { photoCb = cb; $("fileInput").click(); }
      $("fileInput").addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!f || !photoCb) return;
        const rd = new FileReader();
        rd.onload = () => {
          const im = new Image();
          im.onload = () => { photoCb(rd.result, im.naturalWidth, im.naturalHeight); photoCb = null; };
          im.src = rd.result;
        };
        rd.readAsDataURL(f);
      });

      /* ---------- Zoom & pratinjau ---------- */
      $("zoomIn").addEventListener("click", () => { state.zoom = Math.min(2.5, state.zoom * 1.2); layout(); });
      $("zoomOut").addEventListener("click", () => { state.zoom = Math.max(0.4, state.zoom / 1.2); layout(); });
      $("zoomFit").addEventListener("click", () => { state.zoom = 1; layout(); });
      window.addEventListener("resize", layout);
      $("previewBtn").addEventListener("click", () => {
        select(null, false);
        document.body.classList.add("preview");
        layout();
      });
      $("exitPreview").addEventListener("click", () => {
        document.body.classList.remove("preview");
        layout();
      });
      $("undoBtn").addEventListener("click", undo);
      $("redoBtn").addEventListener("click", redo);

      /* ---------- Toast ---------- */
      let toastTimer = null;
      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 3400);
      }

      /* ---------- Pemilih font (pustaka Google Fonts) ---------- */
      const fp = { target: null, changed: false, q: "", cat: "all", shown: 50 };
      const FP_PAGE = 50;
      function fpMatches() {
        const q = fp.q.trim().toLowerCase();
        const want = fp.cat === "all" || fp.cat === "fav" ? fp.cat : parseInt(fp.cat, 10);
        return FONT_CATALOG.filter(([name, cat]) => {
          if (want === "fav") { if (!CURATED_FONTS.includes(name)) return false; }
          else if (want !== "all" && cat !== want) return false;
          return !q || name.toLowerCase().includes(q);
        });
      }
      function openFontPicker(el) {
        fp.target = el; fp.changed = false; fp.q = ""; fp.cat = "all"; fp.shown = FP_PAGE;
        $("fpSearch").value = "";
        $("fpCount").textContent = FONT_CATALOG.length.toLocaleString("id-ID") + " font dari Google Fonts · ketuk untuk pratinjau langsung";
        document.querySelectorAll("#fpCats button").forEach((b) => b.classList.toggle("on", b.dataset.cat === "all"));
        $("fontpicker").classList.add("open");
        document.body.style.overflow = "hidden";
        renderFpList();
      }
      function closeFontPicker() {
        $("fontpicker").classList.remove("open");
        document.body.style.overflow = "";
        if (fp.changed) commit();
        fp.target = null;
        renderPanel();
      }
      function renderFpList() {
        const host = $("fpList");
        host.innerHTML = "";
        const all = fpMatches();
        const cur = fp.target ? famName(fp.target.font) : "";
        all.slice(0, fp.shown).forEach(([name, cat]) => {
          loadFontPreview(name);
          const b = document.createElement("button");
          b.className = "fp-row" + (name === cur ? " on" : "");
          b.innerHTML = `<span class="fp-sample" style="font-family:'${name}', serif">Anya &amp; Dimas</span><span class="fp-meta"><b></b><small>${FONT_CATS[cat]}</small></span>${name === cur ? '<span class="fp-check">✓</span>' : ""}`;
          b.querySelector("b").textContent = name;
          b.addEventListener("click", async () => {
            if (!fp.target) return;
            b.querySelector(".fp-sample").style.opacity = ".45";
            await loadFontFull(name);
            b.querySelector(".fp-sample").style.opacity = "";
            if (!fp.target) return;
            fp.target.font = name;
            fp.changed = true;
            refreshEl(fp.target);
            host.querySelectorAll(".fp-row").forEach((r) => r.classList.remove("on"));
            b.classList.add("on");
            const fc = $("fpCurrent");
            fc.innerHTML = "Dipakai sekarang: <b></b>";
            fc.querySelector("b").textContent = name;
          });
          host.appendChild(b);
        });
        if (!all.length) {
          const p = document.createElement("p");
          p.className = "hint"; p.style.padding = "18px 10px";
          p.textContent = "Tidak ada font yang cocok dengan pencarian itu. Coba kata kunci lain, misalnya nama gaya: script, serif, atau handwriting.";
          host.appendChild(p);
        } else if (all.length > fp.shown) {
          const more = document.createElement("button");
          more.className = "fp-more";
          more.textContent = `Tampilkan lebih banyak (${(all.length - fp.shown).toLocaleString("id-ID")} font lagi)`;
          more.addEventListener("click", () => { fp.shown += FP_PAGE; renderFpList(); host.scrollTop = host.scrollHeight - host.clientHeight - 400; });
          host.appendChild(more);
        }
        const fc = $("fpCurrent");
        fc.innerHTML = "Dipakai sekarang: <b></b>";
        fc.querySelector("b").textContent = cur || "—";
      }
      let fpSearchTimer = null;
      $("fpSearch").addEventListener("input", (e) => {
        clearTimeout(fpSearchTimer);
        fpSearchTimer = setTimeout(() => { fp.q = e.target.value; fp.shown = FP_PAGE; renderFpList(); $("fpList").scrollTop = 0; }, 130);
      });
      document.querySelectorAll("#fpCats button").forEach((b) =>
        b.addEventListener("click", () => {
          fp.cat = b.dataset.cat; fp.shown = FP_PAGE;
          document.querySelectorAll("#fpCats button").forEach((x) => x.classList.toggle("on", x === b));
          renderFpList();
          $("fpList").scrollTop = 0;
        }));
      $("fpClose").addEventListener("click", closeFontPicker);
      $("fpDone").addEventListener("click", closeFontPicker);

      /* ---------- Ekspor resolusi cetak ---------- */
      const imgCache = new Map();
      function loadImg(src) {
        if (imgCache.has(src)) return imgCache.get(src);
        const p = new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = src;
        });
        imgCache.set(src, p);
        return p;
      }
      function svgImage(svgStr, w, h) {
        return new Promise((res, rej) => {
          const withSize = svgStr.replace("<svg ", `<svg width="${w}" height="${h}" `);
          const url = URL.createObjectURL(new Blob([withSize], { type: "image/svg+xml;charset=utf-8" }));
          const im = new Image();
          im.onload = () => { res({ im, url }); };
          im.onerror = (e) => { URL.revokeObjectURL(url); rej(e); };
          im.src = url;
        });
      }
      function canvasBg(x, s, w, h) {
        if (s.kind === "solid") { x.fillStyle = s.c; x.fillRect(0, 0, w, h); return; }
        let g;
        if (s.kind === "linear") {
          g = s.dir === "d" ? x.createLinearGradient(0, 0, w, h) : x.createLinearGradient(0, 0, 0, h);
        } else {
          g = x.createRadialGradient(w / 2, h * 0.3, 10, w / 2, h * 0.3, h * 0.75);
        }
        s.stops.forEach(([p, c]) => g.addColorStop(p, c));
        x.fillStyle = g; x.fillRect(0, 0, w, h);
      }
      function clipShape(x, el, k) {
        const X = el.x * k, Y = el.y * k, w = el.w * k, h = el.h * k;
        x.beginPath();
        if (el.shape === "circle" || el.shape === "oval") {
          x.ellipse(X + w / 2, Y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
        } else if (el.shape === "arch") {
          const r = w / 2;
          x.moveTo(X, Y + h); x.lineTo(X, Y + r); x.arc(X + r, Y + r, r, Math.PI, 0);
          x.lineTo(X + w, Y + h); x.closePath();
        } else {
          const r = (el.shape === "straight" ? 6 : 26) * k;
          if (x.roundRect) x.roundRect(X, Y, w, h, r); else x.rect(X, Y, w, h);
        }
        x.clip();
      }
      function drawDividerCanvas(x, el, k) {
        const X = el.x * k, Y = (el.y + el.h / 2) * k, w = el.w * k;
        const lw = Math.max(1.4, 1.8 * k);
        x.strokeStyle = el.color; x.fillStyle = el.color; x.lineWidth = lw;
        const gap1 = w * (118 / 300), gap2 = w * (182 / 300);
        x.beginPath(); x.moveTo(X + w * (4 / 300), Y); x.lineTo(X + gap1, Y); x.stroke();
        x.beginPath(); x.moveTo(X + gap2, Y); x.lineTo(X + w * (296 / 300), Y); x.stroke();
        const dot = (cx, r) => { x.beginPath(); x.arc(cx, Y, r * k, 0, Math.PI * 2); x.fill(); };
        dot(X + w * (128 / 300), 2.6); dot(X + w * (172 / 300), 2.6); dot(X + w / 2, 2.4);
        const cx = X + w / 2, s = 9 * k;
        x.beginPath();
        x.moveTo(cx, Y - s); x.lineTo(cx + s, Y); x.lineTo(cx, Y + s); x.lineTo(cx - s, Y);
        x.closePath(); x.stroke();
      }
      function drawTextCanvas(x, el, k) {
        x.font = `${el.italic ? "italic " : ""}${el.bold ? "700 " : "400 "}${el.size * k}px ${fam(el.font)}`;
        try { x.letterSpacing = el.ls * k + "px"; } catch (e) { /* browser lama */ }
        x.fillStyle = el.color;
        x.textBaseline = "top";
        const maxW = el.w * k;
        const lhPx = el.size * k * el.lh;
        const lines = [];
        el.text.split("\n").forEach((para) => {
          if (para === "") { lines.push(""); return; }
          const words = para.split(/\s+/);
          let cur = "";
          words.forEach((wd) => {
            const t = cur ? cur + " " + wd : wd;
            if (cur && x.measureText(t).width > maxW) { lines.push(cur); cur = wd; }
            else cur = t;
          });
          lines.push(cur);
        });
        lines.forEach((ln, i) => {
          const lw = x.measureText(ln).width;
          let tx = el.x * k;
          if (el.align === "center") tx = el.x * k + (maxW - lw) / 2;
          else if (el.align === "right") tx = el.x * k + (maxW - lw);
          x.fillText(ln, tx, el.y * k + i * lhPx);
        });
        try { x.letterSpacing = "0px"; } catch (e) {}
      }
      async function renderPrintCanvas(pxW) {
        await Promise.all(
          state.elements.filter((e) => e.type === "text").map((e) => loadFontFull(e.font))
        );
        await document.fonts.ready;
        const k = pxW / W, pxH = Math.round(H * k);
        const c = document.createElement("canvas");
        c.width = pxW; c.height = pxH;
        const x = c.getContext("2d");
        canvasBg(x, state.bg, pxW, pxH);
        const d = await svgImage(decorSVG(state.template), pxW, pxH);
        x.drawImage(d.im, 0, 0, pxW, pxH);
        URL.revokeObjectURL(d.url);
        for (const el of state.elements) {
          if (el.type === "image") {
            const im = await loadImg(el.src);
            if (!el.nw) { el.nw = im.naturalWidth; el.nh = im.naturalHeight; }
            x.save();
            clipShape(x, el, k);
            const g = imgGeom(el);
            x.drawImage(im, g.dx * k, g.dy * k, g.dw * k, g.dh * k);
            x.restore();
          } else if (el.type === "text") {
            drawTextCanvas(x, el, k);
          } else if (el.type === "divider") {
            drawDividerCanvas(x, el, k);
          }
        }
        return c;
      }
      function saveBlob(blob, name) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
      }
      async function exportPNG(btn) {
        btn.disabled = true;
        try {
          const c = await renderPrintCanvas(2480);
          const blob = await new Promise((r) => c.toBlob(r, "image/png"));
          saveBlob(blob, "undangan-pernikahan.png");
          toast("PNG tersimpan — 2480 × 3508 px (300 DPI), siap dibawa ke percetakan.");
        } catch (err) {
          toast("Maaf, ekspor PNG gagal. Coba lagi ya.");
        }
        btn.disabled = false;
        $("dlmenu").classList.remove("open");
      }
      async function exportPDF(btn) {
        btn.disabled = true;
        try {
          const c = await renderPrintCanvas(2480);
          const jpg = c.toDataURL("image/jpeg", 0.96);
          if (window.jspdf && window.jspdf.jsPDF) {
            const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a5", orientation: "portrait" });
            doc.addImage(jpg, "JPEG", 0, 0, 148, 210);
            doc.save("undangan-pernikahan.pdf");
            toast("PDF siap cetak tersimpan — ukuran A5, 300 DPI.");
          } else {
            const blob = await new Promise((r) => c.toBlob(r, "image/png"));
            saveBlob(blob, "undangan-pernikahan.png");
            toast("Pustaka PDF tidak termuat, jadi PNG resolusi tinggi yang diunduh — tetap siap cetak.");
          }
        } catch (err) {
          toast("Maaf, ekspor PDF gagal. Coba unduh PNG-nya ya.");
        }
        btn.disabled = false;
        $("dlmenu").classList.remove("open");
      }
      $("dlPng").addEventListener("click", (e) => exportPNG(e.currentTarget));
      $("dlPdf").addEventListener("click", (e) => exportPDF(e.currentTarget));
      $("dlBtn").addEventListener("click", (e) => { e.stopPropagation(); $("dlmenu").classList.toggle("open"); });
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#dlwrap")) $("dlmenu").classList.remove("open");
      });

      /* ---------- Keyboard (desktop) ---------- */
      window.addEventListener("keydown", (e) => {
        const tag = (e.target.tagName || "").toLowerCase();
        if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
        else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
        else if ((e.key === "Delete" || e.key === "Backspace") && sel()) { e.preventDefault(); deleteEl(sel()); }
        else if (e.key === "Escape") select(null, false);
      });

      /* ---------- Mulai ---------- */
      state.elements = TEMPLATES.emas.make();
      commit();
      renderAll();
    </script>
  </body>
</html>
